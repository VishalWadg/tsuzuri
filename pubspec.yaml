name: offline_kanji_practice
description: >-
  Fully offline Japanese Kanji handwriting practice app (v1 writing module)
  powered by KanjiVG, KANJIDIC2, discrete Frechet stroke matching, dual SQLite
  databases, and FSRS spaced repetition.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  sqlite3: ^2.5.0
  path_provider: ^2.1.5
  path: ^1.9.0
  fsrs: ^2.0.1
  share_plus: ^12.0.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/db/kanji_content.db
    - assets/db/content_version.txt
