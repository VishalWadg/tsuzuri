name: Build Offline Kanji Practice APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild & Verify Content DB and Matcher Benchmark
        run: |
          python3 tools/build_content_db.py --scope joyo
          python3 tools/test_content_db.py
          python3 tools/benchmark_matcher.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Generate Android runner & fetch packages
        run: |
          flutter create . --project-name offline_kanji_practice --platforms android
          flutter pub get

      - name: Run Flutter unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-kanji-practice-v1-apk
          path: build/app/outputs/flutter-apk/app-release.apk
