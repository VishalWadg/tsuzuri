name: Build Offline Kanji Practice APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild & Verify Content DB and Matcher Benchmark
        run: |
          python3 tools/build_content_db.py --scope joyo
          python3 tools/test_content_db.py
          python3 tools/benchmark_matcher.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Fetch Dart packages
        run: flutter pub get

      - name: Run Flutter unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-kanji-practice-v1-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK for release download
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/offline-kanji-practice-v1.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "v1.0.0 — Offline Kanji Practice App"
          body: "Direct APK download for Android. Download **offline-kanji-practice-v1.apk** on your Android phone and tap to install."
          files: |
            build/app/outputs/flutter-apk/offline-kanji-practice-v1.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
