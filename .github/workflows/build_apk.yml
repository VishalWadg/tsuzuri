name: Build Offline Kanji Practice APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Content DB Integrity
        run: python3 tools/test_content_db.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Fetch Dart packages
        run: flutter pub get

      - name: Run Flutter unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-kanji-practice-v1-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK for release download
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/offline-kanji-practice-v1.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: "v1.2.2 — Tsuzuri: Hardware Haptics & Acoustic Feedback"
          body: |
            ## Tsuzuri (綴り) v1.2.2 Update

            ### What's New:
            - **Hardware-Level Haptic Feedback**: Directly commands Android's hardware `Vibrator` motor so vibrations fire reliably even if global "touch feedback" is toggled off in Android settings.
            - **Tactile Rhythm**: 1 crisp vibration pulse for correct strokes; 2 distinct vibration pulses for wrong strokes.
            - **Subtle Acoustic Feedback**: System click sound on correct strokes and subtle alert sound on incorrect strokes.
            - **Dark Mode & 2,136 Joyo Kanji**: Full offline handwriting practice with FSRS spaced repetition.

            ### Download:
            Download **offline-kanji-practice-v1.apk** below or tap the file directly in Telegram to install!
          files: |
            build/app/outputs/flutter-apk/offline-kanji-practice-v1.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send Telegram Release Notification
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          RELEASE_TAG="v1.2.2"
          MESSAGE=$(printf "🚀 <b>New Tsuzuri (綴り) Release: %s</b>\n\nA new Android build has been built and published!\n\n<b>What's New:</b>\n• Hardware vibrator (1 pulse for right, 2 pulses for wrong)\n• Works without needing OS touch feedback enabled\n• Subtle acoustic feedback (click / alert)\n• All 2,136 Joyo Kanji + Dark Mode\n\n📥 <a href=\"https://github.com/VishalWadg/tsuzuri/releases/download/%s/offline-kanji-practice-v1.apk\">Direct APK Download</a>\n🌐 <a href=\"https://github.com/VishalWadg/tsuzuri/releases/tag/%s\">GitHub Release Notes</a>" "${RELEASE_TAG}" "${RELEASE_TAG}" "${RELEASE_TAG}")

          curl --fail-with-body --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "parse_mode=HTML" \
            --data-urlencode "text=${MESSAGE}"

          # Upload APK file directly to Telegram for immediate 1-tap installation
          curl --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument" \
            -F "chat_id=${CHAT_ID}" \
            -F "document=@build/app/outputs/flutter-apk/offline-kanji-practice-v1.apk" \
            -F "caption=📦 Tsuzuri ${RELEASE_TAG} APK (Tap to Install)" || true
