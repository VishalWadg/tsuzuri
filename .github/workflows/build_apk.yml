name: Build Offline Kanji Practice APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Content DB Integrity
        run: python3 tools/test_content_db.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      - name: Fetch Dart packages
        run: flutter pub get

      - name: Run Flutter unit tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-kanji-practice-v1-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Rename APK for release download
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/offline-kanji-practice-v1.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "v1.2.0 — Tsuzuri: Dark Mode, Custom Logo & Haptic Feedback"
          body: |
            ## Tsuzuri (綴り) v1.2.0 Update

            ### What's New:
            - **Haptic Feedback**: Added `android.permission.VIBRATE` and multi-level haptics (stroke success, failure, short stroke, and kanji completion).
            - **Dark Mode**: Automatic phone system theme detection with manual Light / Dark / System switch in Settings ⚙️.
            - **Tsuzuri Rebranding**: Custom calligraphy emblem icon (Android launcher mipmaps & in-app AppBar headers).
            - **All 2,136 Joyo Kanji**: Full offline database with 22,366 verified stroke paths and FSRS spaced repetition.

            ### Download:
            Download **offline-kanji-practice-v1.apk** below and open it on your Android phone to install or update!
          files: |
            build/app/outputs/flutter-apk/offline-kanji-practice-v1.apk
            build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
